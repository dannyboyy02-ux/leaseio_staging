# ─────────────────────────────────────────────────────────────────────
# P2-08: explicit verify_jwt = true for every other function in the
# repo. Adding the stanza pins the desired behavior so a future
# `supabase functions deploy` cannot accidentally flip it. The
# scripts/check-edge-function-config.mjs CI check enforces that every
# supabase/functions/<name>/index.ts has a matching stanza here.
# ─────────────────────────────────────────────────────────────────────

