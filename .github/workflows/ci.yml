name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Hoisted to job level so step-level `if:` can read these via `env.*`.
    # `secrets.*` is not a valid context in step-level `if:` expressions —
    # using it there silently invalidates the entire workflow at parse time,
    # which is what kept this file broken from 2026-04-12 (the original
    # commit that introduced ci.yml) until 2026-05-16 when the actual error
    # message ("Unrecognized named-value: 'secrets'") was finally retrieved
    # from the GitHub Actions UI. Job-level env IS allowed to read secrets,
    # and step-level if IS allowed to read job-level env. Same behavior,
    # valid syntax.
    env:
      SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
      SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
      SUPABASE_PRODUCTION_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase types
        run: npm run check:supabase-types

      - name: Typecheck
        run: npm run typecheck

      - name: Mirror-pair parity
        run: npm run check:mirror-parity

      - name: Edge function config completeness
        run: npm run check:edge-function-config

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      # Smoke-test secrets are required on main pushes — silently skipping
      # would let auth/RLS regressions land unnoticed (audit P2-09). PR
      # branches may legitimately lack secrets (fork PRs); the next step's
      # conditional handles that case.
      - name: Verify smoke-test secrets on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # `if`-form not `&&`: under `set -e` the && short-circuit on a
          # non-empty var (test exits 1) would kill the whole script before
          # later checks ran, masking a partially-configured environment.
          missing=()
          if [ -z "$SUPABASE_STAGING_URL" ]; then missing+=(SUPABASE_STAGING_URL); fi
          if [ -z "$SUPABASE_STAGING_SERVICE_ROLE_KEY" ]; then missing+=(SUPABASE_STAGING_SERVICE_ROLE_KEY); fi
          if [ -z "$SUPABASE_PRODUCTION_URL" ]; then missing+=(SUPABASE_PRODUCTION_URL); fi
          if [ -z "$SUPABASE_PRODUCTION_SERVICE_ROLE_KEY" ]; then missing+=(SUPABASE_PRODUCTION_SERVICE_ROLE_KEY); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Smoke-test secrets missing on main push — cannot silently skip. Missing: ${missing[*]}"
            exit 1
          fi

      - name: Security hardening smoke test
        if: env.SUPABASE_STAGING_URL != '' && env.SUPABASE_STAGING_SERVICE_ROLE_KEY != '' && env.SUPABASE_PRODUCTION_URL != '' && env.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY != ''
        run: npm run smoke:security

  # P1-10 / P2-09: prove the migration chain reconstructs the full schema from
  # scratch. `supabase start` boots a clean local stack and applies every file
  # in supabase/migrations/ in order — if anything in the baseline references a
  # not-yet-created object, has a syntax error, or conflicts with platform-owned
  # objects, this job fails. Runs in parallel with test-and-build so the slow
  # Docker-image phase doesn't block faster feedback on typecheck/test.
  migration-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Replay migration chain on clean Postgres
        run: supabase start

  # Edge functions are Deno → NOT covered by `npm run typecheck` (which is the
  # Node/Vite app only). `deno check` (full type-check) can't run here yet: it
  # 404s resolving supabase-js's deep type graph via esm.sh, which would false-
  # red every supabase-js function (needs a separate import-map refactor). So
  # this is `deno lint` instead, and scoped to the edge files a PR actually
  # changes — it enforces lint-clean on any new/modified function (catching
  # unused vars, unreachable code, missing await, etc.) without failing on the
  # large pre-existing `no-explicit-any` debt in untouched legacy functions.
  # `no-explicit-any` is excluded repo-wide via supabase/functions/deno.lint.json
  # (the deliberate Supabase-row casting pattern). PR-only: a post-merge lint
  # failure on main couldn't be acted on (the commit is already in).
  deno-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint changed edge functions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only --diff-filter=ACMR "${PR_BASE_SHA}...HEAD" -- supabase/functions | grep -E '\.ts$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed edge functions (.ts under supabase/functions) — nothing to lint."
            exit 0
          fi
          echo "Linting changed edge files:"
          echo "$CHANGED"
          deno lint --config supabase/functions/deno.lint.json $CHANGED
